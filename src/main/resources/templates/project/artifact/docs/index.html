<style>
    .request-builder-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .request-card {
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        background: var(--white);
    }

    .request-card-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
        background: var(--background-gray);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }

    .request-card-title {
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .request-card-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .request-basic-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
    }

    .request-basic-row .form-select {
        min-width: 120px;
        text-transform: uppercase;
        font-weight: 600;
    }

    .request-basic-row .form-control {
        flex: 1;
        min-width: 180px;
    }

    .request-tab-list {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border-color);
    }

    .request-tab-btn {
        border: none;
        background: transparent;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        color: #475569;
        border-bottom: 2px solid transparent;
    }

    .request-tab-btn.active {
        color: var(--primary-color);
        border-bottom-color: var(--primary-color);
    }

    .request-tab-panel {
        display: none;
        margin-top: 12px;
    }

    .request-tab-panel.active {
        display: block;
    }

    .request-table-wrapper {
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--white);
    }

    .request-table {
        width: 100%;
        margin-bottom: 0;
        border-collapse: separate;
        border-spacing: 0;
    }

    .request-table thead th {
        background: var(--background-gray);
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #475569;
        border-bottom: 1px solid var(--border-color);
        padding: 10px 12px;
    }

    .request-table tbody td {
        background: var(--white);
        padding: 10px 12px;
        vertical-align: middle;
        border-bottom: 1px solid var(--border-color);
    }

    .request-table tbody tr:nth-child(2n+1) td {
        background: var(--background-gray-light, #f8fafc);
    }

    .request-table-actions {
        width: 40px;
        text-align: center;
    }

    .request-row-remove {
        color: #ef4444;
        font-size: 14px;
    }

    .request-helpers {
        font-size: 12px;
        color: #64748b;
    }

    .request-body-type-group {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
    }

    .request-body-option {
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 16px;
        background: var(--white);
    }

    .request-body-option + .request-body-option {
        margin-top: 16px;
    }

    .request-body-option[data-body-option="none"] {
        background: var(--background-gray);
        border-style: dashed;
        color: #475569;
    }

    .request-raw-toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .request-raw-textarea {
        min-height: 200px;
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    }

    .request-error-message {
        font-size: 12px;
        color: #ef4444;
        margin-top: 8px;
    }

    .json-preview {
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        font-size: 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        max-height: 420px;
        overflow: auto;
        padding: 16px;
        white-space: pre;
    }

    .empty-state {
        border: 1px dashed var(--border-color);
        border-radius: var(--radius);
        padding: 32px;
        text-align: center;
        color: #64748b;
    }
</style>
<div class="container max-w-100">
    <form id="apiDocsForm" th:attr="data-project-idx=${projectIdx},data-docs-idx=${idx}">
        <input type="hidden" name="docsIdx" th:value="${idx}">
        <input type="hidden" name="projectIdx" th:value="${projectIdx}">

        <div class="card mb-4">
            <div class="card-header">
                <h2><i class="fas fa-info-circle"></i> 기본 정보</h2>
            </div>
            <div class="card-body">
                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label class="form-label">제목</label>
                        <input type="text" class="form-control" id="title" placeholder="예: 주문 API" required
                               th:value="${docs != null ? docs.title : ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">버전</label>
                        <input type="text" class="form-control" id="version" placeholder="예: 1.0.0" required
                               th:value="${docs != null ? docs.version : ''}">
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h2 class="mb-0"><i class="fas fa-paper-plane"></i> 요청 빌더</h2>
                <button type="button" class="btn btn-primary btn-sm" id="addRequestCardBtn">
                    <i class="fas fa-plus"></i> 요청 추가
                </button>
            </div>
            <div class="card-body">
                <div id="requestBuilderList" class="request-builder-list">
                    <div class="empty-state" id="requestBuilderEmpty">
                        <i class="fas fa-paper-plane"></i>
                        <p>요청을 추가해 주세요.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="mb-0"><i class="fas fa-code-branch"></i> JSON 미리보기</h2>
                <span class="text-muted" style="font-size: 12px;">요청 빌더 입력을 바탕으로 OpenAPI 유사 스펙을 확인할 수 있습니다.</span>
            </div>
            <div class="card-body">
                <pre id="apiJsonPreview" class="json-preview">{
  "title": "",
  "version": "",
  "endpoints": []
}</pre>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center flex-direction-row-reserve">
                    <div class="btn-group">
                        <button type="button" class="btn btn-secondary" id="downloadBtn">
                            <i class="fas fa-download"></i> 다운로드
                        </button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <i class="fas fa-save"></i>
                            <span th:text="${idx != null} ? '문서 수정' : '문서 저장'">문서 저장</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div style="display: none;" id="apiDocsInitialData" th:text="${apiDocsSpec}"></div>
<script th:src="@{/js/pages/project/artifact/docs/index.js}"></script>
<script>
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeContent);
    } else {
        initializeContent();
    }

    function initializeContent() {
        if (window.DocsRequestManager) {
            window.docsRequestManager = new DocsRequestManager();
        } else {
            setTimeout(initializeContent, 50);
        }
    }
</script>
