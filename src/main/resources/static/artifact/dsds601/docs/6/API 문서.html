<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API 문서</title>
  <style>
    html, body { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <!-- OpenAPI 스펙을 인라인으로 제공 (이 요소 하나만 id="api-reference") -->
  <script id="api-reference" type="application/json">
      {
          "openapi": "3.0.3",
          "info": {
              "title": "test",
              "version": "1.0"
          },
          "paths": {
              "/api/test": {
                  "post": {
                      "requestBody": {
                          "required": true,
                          "content": {
                              "application/json": {
                                  "schema": {
                                      "type": "object",
                                      "properties": {
                                          "name": {
                                              "type": "string",
                                              "example": "value",
                                              "default": "value"
                                          },
                                          "trxId": {
                                              "type": "string",
                                              "example": "TRX-12345",
                                              "default": "TRX-12345"
                                          }
                                      },
                                      "required": [
                                          "name",
                                          "trxId"
                                      ]
                                  }
                              }
                          }
                      },
                      "responses": {
                          "200": {
                              "description": "OK"
                          }
                      }
                  }
              }
          }
      }
  </script>

  <!-- Scalar API Reference 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
